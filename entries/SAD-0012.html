<script>
const META = {"uid": "SAD-0012", "type": "Feature", "category": "Relics", "priority": "Medium", "status": "Done", "release": "0.4.223", "title": "Settings toggle to disable Nature's Prophylactic", "resolution": "Nature's Prophylactic can be switched off in the Sadida settings, so new runs start with Seeded only (default keeps the relic)", "contributors": [], "links": [], "created": "2026-10-01"}, BODY = "## Goal\n\nA boolean in the Sadida settings that keeps **Nature's Prophylactic** out of new runs, so its 40-point damage\nbuffer can be switched off while testing balance (as a starter relic it absorbs the first 40 unblocked damage of\nevery run, which masks early-game numbers).\n\n## Current state\n\n- `Relics/NaturesProphylactic.cs` \u2014 `RelicRarity.Starter`, absorbs the first 40 unblocked damage through\n  `ModifyHpLostAfterOstyLate`, then stays in the relic row as inert scenery. Progress lives in a `Remaining`\n  `SavedProperty` and an \"Absorb\" DynamicVar.\n- `Character/Sadida.cs` \u2014 `StartingRelics => [ModelDb.Relic<Seeded>(), ModelDb.Relic<NaturesProphylactic>()]`.\n- `Settings/SadidaSettings.cs` \u2014 static properties persisted as JSON at `user://sadida_settings.json`; `Load()` runs\n  from `MainFile.Initialize`, `Save()` from the settings dialog. It has one bool and one int today.\n- `Settings/SadidaSettingsPopup.cs` \u2014 an `AcceptDialog` with a CheckBox row (doll HP bars) and a slider (SFX\n  volume). Its text is hardcoded English; the `settings_ui.json` keys exist for the settings-screen row only.\n- `Patches/Character/CharSelectExtraRelicPatch.cs` \u2014 draws starter relics past index 0 on the character select\n  screen and already computes `extraCount = max(0, StartingRelics.Count - 1)`, so a one-relic Sadida hides the\n  extra rows cleanly.\n- `Patches/VanillaCompat/TouchOfOrobasSadidaPatch.cs` \u2014 patches `TouchOfOrobas.GetUpgradedStarterRelic`, which\n  receives the starter relic as a parameter and special-cases `Seeded`; a missing Prophylactic just means that\n  upgrade is never offered for it.\n\n## Implementation\n\n- `Settings/SadidaSettings.cs`: new `NaturesProphylacticEnabled` bool, default `true`, persisted in the existing\n  JSON file. Its doc comment records the two behaviour contracts (new runs only; in co-op the host's value wins).\n- `Character/Sadida.cs`: `StartingRelics` returns `[Seeded, NaturesProphylactic]` when the setting is on and\n  `[Seeded]` when it is off \u2014 no Harmony patch, since it is the mod's own character. It reads\n  `SadidaRunOptions.NaturesProphylacticEnabled`, not the settings class directly.\n- `Multiplayer/SadidaRunOptionsMessage.cs` (new): a mod `INetMessage` carrying the host's value. Vanilla's\n  `MessageTypes.Initialize` appends `ReflectionHelper.GetSubtypesInMods<INetMessage>()`, so the type is registered\n  automatically \u2014 no registration call. Reliable, so it is ordered ahead of the begin-run message.\n- `Multiplayer/SadidaRunOptions.cs` (new): the effective value \u2014 the host's synced value when there is one, the\n  local setting otherwise (singleplayer, or before the host's message arrives).\n- `Multiplayer/SadidaRunOptionsSyncPatch.cs` (new): four `StartRunLobby` hooks \u2014 host prefix on\n  `BeginRunForAllPlayers` (broadcast before vanilla sends `LobbyBeginRunMessage`), host postfix on\n  `HandleClientLobbyJoinRequestMessage` (send to the joining peer, after vanilla has sent the join response that\n  makes the client register the handler), client postfix on `InitializeFromMessage` (register the handler), and\n  postfix on `CleanUp` (drop the cached value when the lobby goes away).\n- `Settings/SadidaSettingsPopup.cs`: a \"Give Nature's Prophylactic\" checkbox, with a tooltip spelling out that it\n  applies to runs started afterwards and that the host's setting governs in co-op.\n- `localization/eng/settings_ui.json`: `SADIDA-NATURES-PROPHYLACTIC.title` / `.desc`. The dialog itself still\n  hardcodes its English strings \u2014 localising the whole dialog is a separate tidy-up.\n\n## Todo\n\n### Done\n\n- [x] `SadidaSettings`: the bool, its default (`true`, so existing players see no change) and its `Load`/`Save`\n      JSON entries.\n- [x] Wording/direction: positive form (\"Give Nature's Prophylactic\"), which reads correctly with a `true` default.\n- [x] `SadidaSettingsPopup`: CheckBox row beside the doll HP bar toggle (the dialog already saves on confirm/cancel).\n- [x] `settings_ui.json`: title/desc keys for the row.\n- [x] `Sadida.StartingRelics`: `[Seeded]` when off, `[Seeded, NaturesProphylactic]` when on.\n- [x] Decision \u2014 **new runs only**. Relics are granted at run start, so a run in progress keeps the relic it was\n      granted; nothing strips it mid-run, and toggling a setting never rewrites an in-flight run.\n- [x] Single-relic safety check: every vanilla reader of `StartingRelics` copes with one entry\n      (`NCharacterSelectScreen` reads index 0, `Player.PopulateStartingRelics`, `RunManager.FinalizeStartingRelics`,\n      `ModelDb.AllRelics`, `NRelicCollectionCategory` and `ProgressSaveManager` all iterate), and\n      `CharSelectExtraRelicPatch` clamps the extra rows to zero.\n- [x] **Multiplayer: host-authoritative, carried through the lobby.** The host broadcasts its value as a mod net\n      message before the run begins (and to each peer that joins), clients cache it and build the run with it, so\n      every client produces the same relic lists. Verified in the beta source that the message path is ordered\n      ahead of run creation: the host's prefix runs before `LobbyBeginRunMessage` is sent, and on the client\n      `Player.CreateForNewRun` (which reads `StartingRelics`) happens before `CleanUpLobby` clears the cached value.\n      Vanilla's own `INetMessage` subtype registry is what makes a mod message possible at all.\n\n### Remaining\n\n- [ ] Verify in game: with the setting off, a new run has no Prophylactic (no relic row entry, no absorb, no\n      counter) and starts normally; with it on, behaviour is unchanged; character select shows a single relic when\n      disabled; Orobas still upgrades `Seeded`; the setting survives a restart (JSON round-trip); an old save loads.\n- [ ] Verify in co-op: host with the setting off and guest with it on (and vice versa) produces the same relic\n      lists on both machines and no divergence warning; a guest that joins mid-lobby still gets the host's value.\n      Note that mod net messages are id'd by the assembled subtype list, so both players must run the same mod\n      build \u2014 which is already true of any content mod in co-op.\n\n### Notes\n\n- Starter relics never appear as rewards (`RelicRarity.Starter` is excluded from reward pools), so only the starting\n  grant needed to change \u2014 no pool filtering.\n- The relic model stays registered: saves and the compendium reference it by id, and a player who wants it back only\n  flips the toggle.\n- The relic is a beta placeholder (\"Temporary starter relic\", reusing Seeded's icon). If it is ever retired\n  outright, this toggle becomes the switch that hides it and the entry can be closed as a buff/removal instead.";
