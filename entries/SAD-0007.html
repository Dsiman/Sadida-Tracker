<script>
const META = {"uid": "SAD-0007", "type": "Bug", "category": "Powers", "priority": "Medium", "status": "Done", "release": "0.4.219", "title": "Merk's Riposte reflect triggers Entomancer's Personal Hive (Dazed)", "resolution": "Merk's Riposte reflect is now non-attack damage (like Thorns), so it no longer triggers Personal Hive", "contributors": ["Merk/Elfie"], "links": [], "created": "2026-09-29"}, BODY = "## Issue\n\nWhen a Doll's Block is reflected by **Merk's Riposte**, it triggers the **Entomancer**'s passive\n**Personal Hive** (\"whenever this is hit by an attack, shuffle Dazed into the attacker's draw pile\"), so the\nplayer gets Dazed cards. A reflect shouldn't count as an attack.\n\n## Cause\n\n- `MerksRiposteDollPower.EchoToAttacker` deals the reflected damage with `ValueProp.Move | ValueProp.Unblockable`\n  and makes the **player** the dealer (so the damage still resolves if the Doll just died).\n- Vanilla `PersonalHivePower.AfterDamageReceived` fires on any `IsPoweredAttack()` hit, which is true for\n  `Move` without `Unpowered`. The Dazed goes to `dealer.Player`, which is the player.\n- `PersonalHiveDollDealerPatch` already stops Doll attacks from triggering Personal Hive, but it only checks for a\n  Doll dealer. Because the reflect's dealer is the player, it slips through.\n\n## Proposed fix\n\nDeal the reflect as non-attack damage, like vanilla **Thorns** (`ValueProp.Unpowered`, keeping `Unblockable`).\nThat stops Personal Hive and any other \"when attacked\" effect from reacting to it. Side effect: the reflect is\nno longer boosted by attack modifiers such as Strength or the target's Vulnerable, which matches \"reflect the\nBlock absorbed\" and how Thorns works.\n\n## Implementation\n\n- `Powers/MerksRiposteDollPower.cs`: reflect damage changed from `Move | Unblockable` to `Unpowered | Unblockable`.\n- Also means Strength and the target's Vulnerable no longer modify the reflect.";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rows = [["Type",META.type],["Category",META.category],["Priority",META.priority],["Status",META.status],
  ["Resolution",META.resolution],
  ["Contributors",(META.contributors||[]).join(", ")],["Created",META.created]];
const rel = String(META.release ?? "").replace(/^v/i, "");
document.getElementById("meta").innerHTML = rows.filter(r => r[1]).map(([k,v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")
  + `<dt>Release</dt><dd>${rel ? `<a href="../release/v${esc(rel)}/">v${esc(rel)}</a>` : "Unreleased"}</dd>`
  + ((META.links||[]).length ? `<dt>Links</dt><dd>${META.links.map(l => `<a href="${esc(l)}">${esc(l)}</a>`).join("<br>")}</dd>` : "");
const html = window.marked ? marked.parse(BODY) : `<pre>${esc(BODY)}</pre>`;

</script></body></html>
