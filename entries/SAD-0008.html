<script>
const META = {"uid": "SAD-0008", "type": "Feature", "category": "Relics", "priority": "Medium", "status": "Done", "release": "0.4.219", "title": "New relic Pael's Needle replaces Pael's Wing for Straw Pile runs", "resolution": "New Ancient relic Pael's Needle replaces Pael's Wing in Straw Pile runs; 6 straw redeems a random unowned Sadida relic", "contributors": [], "links": [], "created": "2026-09-29"}, BODY = "## Summary\n\nA new relic, **Pael's Needle** (\"needle in a haystack\" theme), offered instead of **Pael's Wing** in runs where\nthe player took **Straw Pile**. It adds a 6-straw redeem option to Straw Pile's rewards that grants a random\nSadida relic.\n\n## Obtaining\n\n- When the player takes Straw Pile at the start of the run (Neow), flag the run.\n- If Pael's Wing is offered later in a flagged run, offer Pael's Needle in its place.\n- The reverse order can't happen: Straw Pile is only offered as the first choice of a run.\n\n## Ability\n\n- Pael's Needle is its own relic, with none of Pael's Wing's effects.\n- While the player has **6 or more straw**, Straw Pile's reward options include\n  **\"Spend 6 straw: obtain a random Sadida relic\"**.\n- The relic is picked at random from the pool below, excluding any the player already owns (no duplicates).\n- It can be redeemed whenever the player has 6+ straw, like the Doll tiers.\n\n## Relic pool\n\nStarter and Ancient relics are not in the pool.\n\n- **Seed Pouch:** At the start of each combat, gain 2 Seeds.\n- **Wooden Charm:** Once per turn, the first card you play that costs Seeds costs 1 less Seed.\n- **Dollmaker's Kit:** After shuffling your draw pile, a random Doll card moves to the top.\n- **Blooming Staff:** Every 3rd Doll card you play in a combat draws 1 card.\n- **Fertile Soil:** The first time you gain Seeds each turn, gain 1 extra Seed.\n- **Heart of the Forest:** At the start of your turn, if you have 5 or more Seeds, gain 1 Energy.\n- **Voodoo Totem:** Whenever a Doll enters combat, it gains +8 Max HP.\n- **Seed Vault:** Saves up to 10 of your Seeds at the end of combat and restores them at the start of the next.\n- **Forest Blessing:** Whenever you play a Skill card, gain 1 Seed.\n\n## Implementation notes\n\n- Base the reward on the existing Doll redeem reward (`Rewards/StrawPileRedeemReward.cs`), injected through\n  Straw Pile's `TryModifyRewards`.\n- Sort it after the Doll rewards so the options appear in order: Common, Uncommon and Rare Doll, then relic.\n- Relic rarity: Ancient, matching Pael's Wing and Straw Pile (confirmed).\n- If every relic in the pool is already owned, the relic option doesn't appear (confirmed).\n\n## Implementation\n\n- `Relics/PaelsNeedle.cs`: the relic (Ancient, no effect of its own) and the 9-relic pool.\n- `Patches/VanillaCompat/PaelsNeedleReplacesWingPatch.cs`: after Pael rolls its options, swaps Pael's Wing for\n  Pael's Needle if the player owns Straw Pile.\n- `Relics/StrawPile.cs` + `Rewards/StrawPileRedeemReward.cs`: the relic redeem is Straw Pile's tier 4 (cost 6),\n  offered only while Pael's Needle is owned and unowned pool relics remain, sorted after the Doll tiers. Drawn\n  with the player's reward RNG, so multiplayer peers get the same relic.\n- Like the Doll tiers, it isn't offered on the final boss reward screen.\n- Art: `images/relics/paels_needle(_outline).png` at 94px, `images/relics/big/` at 256px.\n- Not covered: Pael's Wing can also come from the generic event relic pool; only Pael's own offer is swapped.";
