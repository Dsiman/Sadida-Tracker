potions is the potion being aimed.\n- `Sadida/localization/eng/potions.json`: description now reads \"Heal 8 HP. Can be thrown at one of your [gold]Dolls[/gold].\"\n\n### Targeting rules\n\n- **Yourself** \u2014 always: no extra click in singleplayer when no Doll is alive, click your own character (or a teammate, in multiplayer) when you want to.\n- **Your own living Dolls** \u2014 only while at least one is alive; the arrow opens as soon as it can do something.\n- **Nothing else** \u2014 every rule is gated on the marker, so other potions keep their exact vanilla behaviour, and `AnyAlly` was deliberately avoided (it excludes the owner and has no arm in the controller targeting flow, which throws).";
