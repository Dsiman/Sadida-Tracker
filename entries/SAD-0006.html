<script>
const META = {"uid": "SAD-0006", "type": "Bug", "category": "Dolls", "priority": "Medium", "status": "Done", "release": "0.4.219", "title": "Intent graphic shows a higher number than the tooltip and real value", "resolution": "Block, heal and growth Doll intents now show the plain amount on the icon, not a damage-modified value", "contributors": [], "links": [], "created": "2026-09-29"}, BODY = "## Issue\n\nSome intents don't show the correct number on the intent graphic.\n\n- The tooltip says **x**.\n- The real value (what actually happens) is **x**.\n- The intent graphic shows **y**, usually higher than x.\n\n## Confirmed example\n\nVoodoll's growth intent (gain Max HP + Doll count): the intent graphic shows **14**, and the tooltip/keyword\npreview shows **13**.\n\n## Likely cause\n\n- The non-attack Doll intents (`DollGrowIntent`, `DollDefendIntent`, `DollHealIntent` in `Dolls/DollIntents.cs`)\n  reuse the game's `AttackIntent` so a number renders on the icon.\n- The icon number comes from `AttackIntent.GetSingleDamage`, which runs the value through `Hook.ModifyDamage`,\n  as if it were damage aimed at you. So attack modifiers such as the Doll's Strength or your Vulnerable get added\n  to a growth, block or heal amount.\n- The tooltip uses the raw value (`{Amount}` from the same calc), and so does the actual effect\n  (`ExecuteGainMaxHpPlusDollCountEffect`). That's why tooltip and real value agree and the icon is higher.\n- Voodoll: base plus Doll count = 13; one point of damage modification on top gives the 14 on the icon.\n\n## Proposed fix\n\nIn those non-attack intents, build the icon label and total from the raw calc instead of `GetSingleDamage` /\n`GetTotalDamage`, so no damage modifiers apply. Check every `AttackIntent` subclass in `DollIntents.cs` that\nisn't a real attack.\n\n## Implementation\n\n- `Dolls/DollIntents.cs`: `DollDefendIntent`, `DollHealIntent` and `DollGrowIntent` now use the raw amount for the\n  icon label and total instead of `AttackIntent.GetSingleDamage`, so Strength/Vulnerable no longer inflate them.\n- Real Doll attack intents are unchanged. Note: `GetSingleDamage` computes them as if the Doll attacked *you*\n  (your Vulnerable counts, the enemy's doesn't). Separate issue if it turns out to matter.";
