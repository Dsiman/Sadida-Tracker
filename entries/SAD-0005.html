<h1>Investigate a separate card type for summon cards</h1><p class="sub uid">SAD-0005</p>
<div class="card"><dl id="meta"></dl><div class="body" id="body"></div></div>
</main>
<script>
const META = {"uid": "SAD-0005", "type": "Feature", "category": "Cards", "priority": "Medium", "status": "Done", "release": "0.4.223", "title": "Investigate a separate card type for summon cards", "resolution": "Doll summon cards now have their own Summon card type: they read 'Summon' on the card and no longer count as Skills for vanilla relics, powers, events, card pools or Skill counters. Sadida-internal summon synergies are unchanged.", "contributors": [], "links": [], "created": "2026-09-29"}, BODY = "## Goal\n\nGive the summon cards (the 9 cards in `Cards/DollSummons/`) their own card type, \"Summon\", so they no longer read\nas Skills (the \"Spells\" group) and stop counting as Skills everywhere.\n\n## Approach\n\nSummon is a **real `CardType` value** \u2014 the next unused number after vanilla's Quest \u2014 carried by `SadidaDollCard`\nthrough a `Type` override. Vanilla then stops treating summons as Skills everywhere by itself: no per-effect\npatching, no list of vanilla sites to keep in sync.\n\nThe alternative from the investigation (keep `CardType.Skill` and patch each vanilla Skill effect) was dropped\nonce the sites were inspected: it cannot reach the ones that matter. Several interactions compute from the type\ninside `CalculatedVar` lambdas (`Flechettes` hits = Skill cards in hand, `Pinpoint` damage = Skills played this\nturn), and others have already applied their effect by the time a postfix would run (`Burst`, `Corruption`,\n`Vital Spark`, `Smoggy`), so \"un-Skill\" patches would have to reimplement vanilla logic instead of excluding\nsummons from it.\n\n## Current state (before this change)\n\n- The game's `CardType` is a closed enum: None, Attack, Skill, Power, Status, Curse, Quest.\n- Every summon was a `SadidaCard(cost, CardType.Skill, \u2026)`, so summons triggered and were counted by every\n  Skill interaction in the game.\n- `ForestBlessing` was the only Sadida effect keyed on `CardType.Skill`; the rest of the mod detects summon cards\n  with the `SadidaDollCard` marker.\n\n## Implementation\n\n- `Cards/Base/SadidaCardType.cs` (new): the `Summon` value plus the safety inventory for an out-of-range enum\n  value (see the notes at the bottom of this entry).\n- `Cards/Base/SadidaDollCard.cs`: `public override CardType Type => SadidaCardType.Summon;` \u2014 the 9 summon cards\n  now report Summon; `DollPreviewCard` (unobtainable Token) stays a plain Skill.\n- `Patches/Dolls/SummonCardTypePatch.cs` (new): renders the type name as \"Summon\" and answers the three card-art\n  paths vanilla derives from the type:\n  - `CardTypeExtensions.ToLocString` \u2192 `SADIDA-CARD_TYPE_SUMMON`, which is what the card's type plaque shows\n    (`NCard.UpdateTypePlaque`). Vanilla's switch throws for an unknown value and takes only the enum, so this is\n    the one place a card-specific label can come from.\n  - `CardModel.FramePath` / `PortraitBorderPath` / `AncientTextBgPath` \u2192 borrow the Skill art (vanilla does the\n    same for None/Status/Curse, and keeps the shared beta frame for Ancient rarity). These three switches are the\n    only places in the game that would throw on the new value.\n- `localization/eng/cards.json`: `SADIDA-CARD_TYPE_SUMMON` = \"Summon\" (the mod's own table \u2014 vanilla's\n  `gameplay_ui` table is not ours to extend).\n- `Patches/Character/SadidaFrameMaterialPatch.cs`: maps Summon to its own leaf pair.\n- `images/card_frame/summon_mask.png` (+ `.pdn` source) and `materials/cards/frames/sadida_frame_summon_mat.tres`\n  (new): the Summon frame art, copied from the skill pair so it can be drawn later. The type name on the card is\n  the runtime plaque (the label patch above), not baked into the frame art.\n- `Patches/VanillaCompat/SadidaMerchantSummonSlotPatch.cs` (new): Sadida shops ask for a Summon in the second Skill\n  slot. Vanilla only ever requests Attack/Skill/Power, so no shop could stock a summon once it stopped being a\n  Skill.\n\n## Todo\n\n### Identity\n\n- [x] \"Summon\" label entry in the mod's card table.\n- [x] Card type plaque reads \"Summon\" (comes free with the label patch \u2014 `NCard` needs no patch of its own).\n- [x] Frame decision: summon cards have their own Sadida leaf overlay (`summon_mask.png` +\n      `sadida_frame_summon_mat.tres`, a copy of the skill pair, wired through `SadidaFrameMaterialPatch`). The\n      vanilla frame face under the overlay still reuses the skill atlas sprite \u2014 the game's atlas has no summon\n      entry to point at.\n- [x] Library decision: summons sit under the library's \"Other\" type tickbox (they are neither Attack, Skill nor\n      Power). A dedicated tickbox is listed as an optional follow-up below.\n- [x] Shop decision: Sadida shops stock a summon in the second Skill slot (vanilla never asks for the type).\n- [x] Doll preview cards (unobtainable Token Skills) deliberately stay plain Skills.\n\n### Summons stop counting as Skills\n\n- [x] Shared marker is the type itself (`SadidaCardType.Summon`) \u2014 no per-effect predicate needed.\n- [x] Vanilla relics (Burning Sticks, Letter Opener, Rainbow Ring, Toxic Egg, Tuning Fork, War Paint), powers\n      (Burst, Corruption, Enrage, Free Skill, Master Planner, Smoggy, Vital Spark), potions (Skill Potion, Orobic\n      Acid), events (Tinker Time, The Future of Potions, Self Help Book), the Skill-card selectors and the Skill\n      counters (Flechettes, Lunar Blast, Pinpoint, Make It So) all ignore summons now, without being patched.\n- [x] The `Imbued` enchantment and the `Tainted` affliction no longer apply to summons by type; the mod's\n      `EnchantExcludeDollCardsPatch` is kept because it also blocks the non-type enchantments (e.g. Nimble) that\n      never worked on summon cards.\n- [x] `ForestBlessing` no longer counts summons (accepted \u2014 see the notes).\n- [x] Sadida-internal synergies are unchanged: they check `SadidaDollCard`, not the type (`Winnow`,\n      `LoneSadidaPower`, `StrawPile` + redeems, `BloomingStaff`, `DollmakersKit`,\n      `PaelsWingDollRedeemFilterPatch`, the per-doll recycle powers).\n\n### Verify\n\n- [ ] In game: type plaque reads \"Summon\" on all 9 summons (base and upgraded), in hand, in the compendium and on\n      card rewards; the frame looks right; the library \"Other\" tickbox finds them.\n- [ ] Shop: a Sadida merchant stocks exactly one summon card in the second Skill slot, with prices/sale roll in\n      line with the other slots. A non-Sadida character's shop (and a co-op partner's shop) must be unchanged.\n- [ ] One pass per dropped interaction, with a vanilla Skill card as the control (e.g. Burst does not double a\n      summon, Corruption does not make it free, Toxic Egg does not upgrade it, Skill Potion does not offer it).\n- [ ] Multiplayer host/client parity with summons in hand and deck, plus a save/load.\n- [ ] Regression sweep of the doll features above.\n\n### Optional follow-ups\n\n- [x] Summon frame art: the Sadida leaf overlay is copied from the skill pair and wired (`summon_mask.png` +\n      `sadida_frame_summon_mat.tres`). It looks identical to skill until the art is drawn; a Summon *atlas* frame\n      face would need vanilla art we can't ship.\n- [ ] A dedicated \"Summon\" tickbox in the card library instead of falling under \"Other\".\n- [x] Merchant card slots: Sadida shops ask for a Summon in the second Skill slot\n      (`SadidaMerchantSummonSlotPatch`), falling back to vanilla's spread when the unlocked pool can't fill it.\n- [ ] If a 0-cost summon is ever added, All for One will not return it from the discard pile (that filter accepts\n      only 0-cost Attack/Skill/Power cards).";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const rel = String(META.release ?? "").replace(/^v/i, "");
document.getElementById("meta").innerHTML = rows.filter(r => r[1]).map(([k,v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")
  + `<dt>Release</dt><dd>${rel ? `<a href="../release/v${esc(rel)}/">v${esc(rel)}</a>` : "Unreleased"}</dd>`
  + ((META.links||[]).length ? `<dt>Links</dt><dd>${META.links.map(l => `<a href="${esc(l)}">${esc(l)}</a>`).join("<br>")}</dd>` : "");

document.getElementById("body").innerHTML = html;
</script></body></html>
